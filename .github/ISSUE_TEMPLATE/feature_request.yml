---
name: Feature request
description: Suggest a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the task you are doing today and what makes it hard.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like chipnum to do?
      description: A sketch of the input and the output you want.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
