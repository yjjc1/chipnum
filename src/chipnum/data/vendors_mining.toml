# Second vendor batch — families found by mining a 7,441-part-number corpus
# of Chinese-language semiconductor industry articles (2016-2026).
#
# Every prefix below was hand-verified against at least one real sample from
# that corpus. The corpus itself is not redistributed; the regression test
# tests/test_corpus.py carries a checked subset of the samples.
#
# This file is concatenated with vendors.toml at import time. A vendor name
# may appear in both files — prefixes are merged, not overridden — so a
# vendor can be extended in either file.
#
# HARD RULE learned the hard way: never add a prefix shorter than three
# characters here. Two-letter prefixes ("V", "M4", "S2") collide with the
# entire English alphabet of part numbers and destroy precision. If a real
# family only has a two-character marker, add the third character that
# disambiguates it (S29GL not S29, M34E not M3) or leave it out and let the
# part number report as unknown. Reporting "unknown" is correct; confidently
# naming the wrong vendor is not.
#
# Run `python -m chipnum.audit` after editing.

[[vendor]]
name = "NXP Semiconductors"
aliases = []
prefixes = [
  { p = "S9S12", cat = "mcu" },
  { p = "S912Z", cat = "mcu" },
  { p = "MCIMX", cat = "soc" },
  { p = "MIMX", cat = "soc" },
  { p = "UJA", cat = "automotive" },
]

