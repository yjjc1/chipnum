# chipnum vendor prefix database
#
# Matching rules (see src/chipnum/vendors.py and docs/design.md):
#
#   1. Prefixes are matched longest-first, so "TMP117" resolves via "TMP"
#      before "TM" is ever considered.
#   2. A prefix shorter than MIN_PREFIX_LEN only wins if nothing longer
#      matches. Two-letter prefixes are not evidence on their own.
#   3. A part number that no prefix claims resolves to vendor=None. The tool
#      reports "unknown" rather than guessing.
#
# Adding a vendor never requires touching Python code — see
# docs/adding-vendors.md. Run `python -m chipnum.audit` after any edit.

